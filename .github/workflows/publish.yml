name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip 'build>=1.3,<2'
      - run: python -m build
      - name: Upload immutable release distributions
        id: distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Record artifact digest
        run: echo '${{ steps.distributions.outputs.artifact-digest }}'

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions-${{ github.sha }}
          path: dist
      - run: python -m pip install --upgrade pip 'twine>=6.1,<7'
      - run: bash scripts/verify-artifacts.sh dist

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions-${{ github.sha }}
          path: dist
      - name: Publish verified distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
