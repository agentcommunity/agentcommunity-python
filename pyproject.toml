[build-system]
requires = ["hatchling>=1.30.1,<1.31"]
build-backend = "hatchling.build"

[project]
name = "agentcommunity"
version = "0.1.0"
description = "Typed Python client for the Agent Community MCP endpoint"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.20,<5",
  "mcp>=2.1.1,<3",
  "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://agentcommunity.org"
Documentation = "https://agentcommunity.org/docs/mcp-server"
Source = "https://github.com/agentcommunity/agentcommunity-python"
Issues = "https://github.com/agentcommunity/agentcommunity-python/issues"

[project.optional-dependencies]
dev = [
  "anyio>=4.10,<5",
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "tomli>=2,<3; python_version < '3.11'",
  "twine>=6.1,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcommunity"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "pyproject.toml",
  "src/agentcommunity",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "scripts/hatch-sdist.py"

[tool.pytest.ini_options]
addopts = "-ra -m 'not production'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "production: tests that call the live Agent Community endpoint",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
