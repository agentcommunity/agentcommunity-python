[build-system]
requires = ["hatchling>=1.30.1,<1.31"]
build-backend = "hatchling.build"

[project]
name = "agentcommunity"
version = "0.1.0"
description = "Typed Python client for the Agent Community MCP endpoint"
readme = { text = "Official typed Python client for the Agent Community MCP endpoint.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.20,<5",
  "mcp>=2.1.1,<3",
  "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://agentcommunity.org"
Documentation = "https://agentcommunity.org/mcp/docs"
Source = "https://github.com/agentcommunity/agentcommunity-python"
Issues = "https://github.com/agentcommunity/agentcommunity-python/issues"

[project.optional-dependencies]
dev = [
  "anyio>=4.10,<5",
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcommunity"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
